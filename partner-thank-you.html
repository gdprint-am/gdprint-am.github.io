<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDprinting | Հայտն ընդունված է</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .thank-you {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f8f8f8;
      padding: 40px;
    }
    .thank-card {
      background: #fff;
      padding: 50px 40px;
      border-radius: 16px;
      max-width: 520px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    .thank-card h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }
    .thank-card p {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
    }
    .thank-card a {
      display: inline-block;
      padding: 14px 36px;
      background: #000;
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-size: 15px;
    }
    .thank-card a:hover {
      background: #333;
    }
  </style>
</head>

<body>

<section class="thank-you">
  <div class="thank-card">
    <h1>Շնորհակալություն 🙌</h1>
    <p>
      Ձեր գործընկերային հայտը հաջողությամբ ուղարկվել է։  
      Մեր թիմը կկապվի Ձեզ հետ ամենամոտ ժամանակում։
    </p>

    <a href="home.html">Վերադառնալ գլխավոր էջ</a>
  </div>
</section>

</body>
</html>
