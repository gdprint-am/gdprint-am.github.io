<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Վճարում — GDprint</title></head><body><div class="app"><script>document.write(top('Վճարում'))</script><main class="page"><div id="box" class="card payment-card"><div class="empty-state"><b>Բեռնվում է...</b></div></div></main><script>document.write(nav('orders'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;const no=new URLSearchParams(location.search).get('no'),o=await loadOrderByNumber(no);if(!o)return showAppMessage('Պատվերը չի գտնվել');const p=await loadPaymentRequest(o.id),box=document.getElementById('box');if(!p){box.innerHTML='<div class="empty-state"><b>Վճարման հարցում դեռ չկա</b><span>GDprint-ը վճարման հղումը կհայտնի պատվերի հաստատումից հետո։</span></div>';return}box.innerHTML=`<div class="row"><div><div class="order-no">#${esc(o.order_number)}</div><div class="meta">${esc(o.service_name||'')}</div></div><span class="payment-status ${p.status==='paid'?'paid':''}">${p.status==='paid'?'Վճարված է':'Սպասում է վճարման'}</span></div><div class="price-panel"><div><b>${money(p.amount)}</b><small>${esc(p.provider_label||'Առցանց վճարում')}</small></div></div>${p.payment_url&&p.status!=='paid'?`<a class="btn btn-gold wide" href="${esc(p.payment_url)}" target="_blank" rel="noopener">Անցնել անվտանգ վճարման →</a>`:''}${p.instructions?`<div class="quote-box" style="margin-top:12px">${esc(p.instructions)}</div>`:''}`})();</script></body></html>
