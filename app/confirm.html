<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Հաստատում — GDprint</title></head><body><div class="app"><script>document.write(top('Պատվերի հաստատում'))</script><main class="page"><section class="card" style="padding:18px"><div style="width:64px;height:64px;border-radius:50%;background:#e8f7ee;color:#179252;display:grid;place-items:center;font-size:32px;margin:auto">✓</div><h2 style="text-align:center">Ստուգեք պատվերը</h2><div id="summary" class="summary-list"></div><div class="price-panel"><span>Վերջնական հաշվարկ</span><div id="price"></div></div><button id="confirm-btn" class="btn btn-gold wide">Հաստատել և գրանցել պատվերը</button><button class="btn btn-outline wide" style="margin-top:10px" onclick="history.back()">← Վերադառնալ</button></section></main><script>document.write(nav('services'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script src="assets/js/pricing.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;const draft=JSON.parse(sessionStorage.getItem('gdOrderDraft')||'null');if(!draft){location.href='services.html';return}const files=JSON.parse(sessionStorage.getItem('gdUploadedFiles')||'[]');const r=gdCalculatePrice(draft.service_key,draft.details);const s=serviceByKey(draft.service_key);const labels={quantity:'Քանակ',size:'Չափս',width:'Լայնություն',height:'Բարձրություն',material:'Նյութ',package_rate:'Փաթեթի գին',border_cut:'Եզրագծային կտրվածք',eyelet_count:'Ողակներ',print_type:'Տպագրության տեսակ',square_meters:'Քառակուսի մետր',company_name:'Ընկերություն',company_address:'Հասցե',weight:'Թղթի խտություն',paper_type:'Թղթի տեսակ',calendar_type:'Օրացույցի տեսակ'};let rows=`<div class="summary-row"><span>Ծառայություն</span><b>${esc(s[1])}</b></div>`;Object.entries(r.normalized||{}).filter(([k,v])=>v!==''&&v!=null&&k!=='quote_required').forEach(([k,v])=>rows+=`<div class="summary-row"><span>${esc(labels[k]||k)}</span><b>${esc(v)}</b></div>`);rows+=`<div class="summary-row"><span>Ֆայլեր</span><b>${files.length} հատ</b></div>`;if(draft.description)rows+=`<div class="summary-row"><span>Նկարագրություն</span><b>${esc(draft.description)}</b></div>`;document.getElementById('summary').innerHTML=rows;document.getElementById('price').innerHTML=r.contractual?'<b>Պայմանագրային</b><small>Վերջնական գինը կհաստատի GDprint-ը</small>':`<b>${money(r.amount)}</b><small>Հաշվարկված է սերվերի նույն կանոններով</small>`;document.getElementById('confirm-btn').onclick=async()=>{const b=document.getElementById('confirm-btn');b.disabled=true;b.textContent='Գրանցվում է...';try{const order=await submitCustomerOrder(draft,files);location.href='order.html?no='+encodeURIComponent(order.order_number)+'&created=1'}catch(e){showAppMessage(e.message);b.disabled=false;b.textContent='Հաստատել և գրանցել պատվերը'}}})();</script></body></html>
