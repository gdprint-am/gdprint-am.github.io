<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Ծառայություններ — GDprint</title></head><body><div class="app"><script>document.write(top('Ծառայություններ'))</script><main class="page"><input id="search" class="search" placeholder="Որոնել ծառայություն..."><div id="service-list" class="service-list" style="margin-top:12px"></div></main><script>document.write(nav('services'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;const box=document.getElementById('service-list');const render=q=>{const qq=(q||'').toLowerCase();box.innerHTML=GD.services.filter(s=>(s[1]+' '+s[2]).toLowerCase().includes(qq)).map(s=>`<a class="card service" href="service.html?key=${s[0]}"><div class="service-art"><b>${s[3]}</b></div><div><h3>${s[1]}</h3><p>${s[2]}</p></div><span class="chev">›</span></a>`).join('')||'<div class="card empty-state"><b>Չգտնվեց</b></div>'};render('');document.getElementById('search').oninput=e=>render(e.target.value)})();</script></body></html>
