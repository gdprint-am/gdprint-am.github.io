<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/app.css"><title>GDprint</title></head><body><div class="app"><script>document.write(top(''))</script><main class="page"><section class="hero"><div class="eyebrow">GDprint Online Printing</div><h1 id="hello">Տպագրություն արագ, պարզ և հարմար</h1><p>Ընտրեք ծառայությունը, հաշվեք արժեքը և հետևեք պատվերին մեկ հավելվածից։</p><a class="btn btn-gold" href="services.html">Նոր պատվեր →</a></section><div class="section-head"><h2>Արագ ընտրություն</h2><a href="services.html">Բոլորը</a></div><div class="quick-grid"><a class="quick" href="service.html?key=business_cards"><i>BC</i>Այցեքարտ</a><a class="quick" href="service.html?key=flyer"><i>FL</i>Թռուցիկ</a><a class="quick" href="service.html?key=photo_printing"><i>PH</i>Ֆոտո</a><a class="quick" href="services.html"><i>•••</i>Ավելին</a></div><div class="section-head"><h2>Առաջարկներ</h2><a href="services.html">Պատվիրել</a></div><div id="offers" class="offer-strip"><div class="card empty-state" style="min-width:100%"><b>Բեռնվում է...</b></div></div><div class="section-head"><h2>Վերջին պատվերը</h2><a href="orders.html">Պատմություն</a></div><div id="last-order"><div class="card empty-state"><b>Բեռնվում է...</b></div></div></main><script>document.write(nav('home'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{const c=await requireCustomer();if(!c)return;document.getElementById('hello').textContent=(c.customer.full_name?c.customer.full_name.split(' ')[0]+', ':'')+'տպագրությունը միշտ ձեր ձեռքում';try{const offers=await lo
