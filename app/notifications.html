<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Ծանուցումներ — GDprint</title></head><body><div class="app"><script>document.write(top('Ծանուցումներ'))</script><main class="page"><div id="notifications" style="display:grid;gap:10px"></div></main><script>document.write(nav('notifications'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());(async()=>{if(!await requireCustomer())return;try{const n=await loadCustomerNotifications();document.getElementById('notifications').innerHTML=n.length?n.map(x=>`<div class="card notice"><span class="notif-dot" style="opacity:${x.is_read?.35:1}"></span><div><h4>${esc(x.title)}</h4><p>${esc(x.message||'')}</p><div class="meta">${new Date(x.created_at).toLocaleString('hy-AM')}</div></div></div>`).join(''):'<div class="card empty-state"><b>Նոր ծանուցումներ չկան</b></div>';await markCustomerNotificationsRead()}catch(e){showAppMessage(e.message)}})();</script></body></html>
