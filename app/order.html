<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Պատվերի հետևում — GDprint</title></head><body><div class="app"><script>document.write(top('Պատվերի հետևում'))</script><main class="page"><div id="order-head"></div><section id="timeline" class="card timeline"></section><div id="order-price" class="card order-card" style="margin-top:12px"></div><div id="order-actions" class="action-grid" style="margin-top:12px"></div><div id="proof"></div><div id="payment"></div><section class="card" style="padding:16px;margin-top:12px"><h3 style="margin-top:0">Հաղորդագրություն GDprint-ին</h3><div class="field"><textarea id="msg" placeholder="Գրեք հարցը կամ նշումը..."></textarea></div><button id="send-msg" class="btn btn-outline wide">Ուղարկել հաղորդագրություն</button></section></main><script>document.write(nav('orders'))</script></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/qrcode.js"></script><script src="assets/js/app.js"></script><script src="assets/js/customer.js"></script><script>document.body.insertAdjacentHTML('beforeend',desktop());const steps=[['pending','Պատվերն ընդունված է'],['design','Դիզայն / նախապատրաստում'],['printing','Տպագրություն'],['ready','Պատրաստ է'],['delivered','Առաքված է']];(async()=>{if(!await requireCustomer())return;const no=new URLSearchParams(location.search).get('no');try{const o=await loadOrderByNumber(no);if(!o)throw new Error('Պատվերը չի գտնվել');if(new URLSearchParams(location.search).get('created'))showAppMessage('Պատվերը հաջողությամբ գրանցվել է','success');document.getElementById('order-head').innerHTML=`<div class="row" style="margin:8px 0 14px"><div><div class="order-no">#${esc(o.order_number)}</div><div class="meta">${esc(o.service_name||o.service_key)}</div></div><span class="badge">${esc(statusLabel(o.status))}</span></div>`;const idx=steps.findIndex(x=>x[0]===o.status);document.getElementById('timeline').innerHTML=steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}"><div class="dot">${i<idx?'✓':i===idx?'•':''}</div><div><h4>${s[1]}</h4><p>${i<idx?'Ավարտված':i===idx?'Ընթացիկ փուլ':'Սպասվում է'}</p></div></div>`).join('')+(o.status==='cancelled'?'<div class="step current"><div class="dot">!</div><div><h4>Պատվերը չեղարկված է</h4><p>Կապվեք GDprint-ի հետ մանրամասների համար</p></div></div>':'');document.getElementById('order-price').innerHTML=`<div class="row"><span>Ընդհանուր գին</span><strong class="price" style="margin:0">${Number(o.total_amount)>0?money(o.total_amount):'Պայմանագրային'}</strong></div>`;document.getElementById('order-actions').innerHTML=`<button id="repeat" class="card action-card" style="border:1px solid var(--line);text-align:left"><b>↻ Կրկնել պատվերը</b><span>Նույն պարամետրերով նոր պատվեր</span></button><a class="card action-card" href="payment.html?no=${encodeURIComponent(o.order_number)}"><b>Վճարում</b><span>Բացել վճարման հարցումը</span></a>`;document.getElementById('repeat').onclick=async()=>{if(!confirm('Կրկնե՞լ այս պատվերը նույն պարամետրերով։'))return;try{const n=await repeatOrder(o.id);location.href='order.html?no='+encodeURIComponent(n.order_number)+'&created=1'}catch(e){showAppMessage(e.message)}};const proof=await loadLatestProof(o.id);if(proof){let url=await signedFileUrl(proof.storage_path,900);document.getElementById('proof').innerHTML=`<section class="card proof-card"><div class="row"><h3 style="margin:0">Դիզայնի հաստատում</h3><span class="status-chip ${proof.status==='approved'?'green':proof.status==='changes_requested'?'red':'gold'}">${proof.status==='approved'?'Հաստատված է':proof.status==='changes_requested'?'Փոփոխություն է պահանջվել':'Սպասում է ձեր պատասխանին'}</span></div><p class="meta">Տարբերակ ${proof.version}</p><div class="proof-preview">${url&&/\.(png|jpe?g|webp)$/i.test(proof.file_name)?`<img src="${url}" alt="Դիզայն">`:`<a class="btn btn-outline" href="${url}" target="_blank">Բացել ${esc(proof.file_name)}</a>`}</div>${proof.status==='pending'?`<div class="field"><label>Մեկնաբանություն (եթե փոփոխություն է պետք)</label><textarea id="proof-comment" placeholder="Գրեք ինչ փոխել..."></textarea></div><div class="proof-actions"><button id="approve-proof" class="btn btn-success">✓ Հաստատել</button><button id="change-proof" class="btn btn-danger-soft">Փոփոխություն</button></div>`:''}</section>`;if(proof.status==='pending'){document.getElementById('approve-proof').onclick=async()=>{if(!confirm('Հաստատե՞լ դիզայնը տպագրության համար։'))return;try{await respondToProof(proof.id,'approved','');showAppMessage('Դիզայնը հաստատված է','success');setTimeout(()=>location.reload(),500)}catch(e){showAppMessage(e.message)}};document.getElementById('change-proof').onclick=async()=>{const c=document.getElementById('proof-comment').value.trim();if(!c)return showAppMessage('Գրեք՝ ինչ փոփոխություն է անհրաժեշտ');try{await respondToProof(proof.id,'changes_requested',c);showAppMessage('Փոփոխության պահանջն ուղարկված է','success');setTimeout(()=>location.reload(),500)}catch(e){showAppMessage(e.message)}}}}const pay=await loadPaymentRequest(o.id);if(pay&&pay.status!=='paid')document.getElementById('payment').innerHTML=`<section class="card payment-card" style="margin-top:12px"><div class="row"><div><b>Վճարման հարցում</b><div class="meta">${money(pay.amount)}</div></div><a class="btn btn-gold" href="payment.html?no=${encodeURIComponent(o.order_number)}">Վճարել</a></div></section>`;document.getElementById('send-msg').onclick=async()=>{const m=document.getElementById('msg').value.trim();if(!m)return;const {error}=await supabaseClient.rpc('add_customer_order_message',{p_order_id:o.id,p_message:m});if(error)return showAppMessage(error.message);document.getElementById('msg').value='';showAppMessage('Հաղորդագրությունն ուղարկված է','success')}}catch(e){showAppMessage(e.message)}})();</script></body></html>
